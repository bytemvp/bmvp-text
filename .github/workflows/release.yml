name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bmvp-text-windows-x64
            ext: .exe

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bmvp-text-macos-arm64
            ext: ""

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: bmvp-text-macos-x64
            ext: ""

          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: bmvp-text-linux-x64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      # Linux: install system dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-composite0-dev \
            libxcb-randr0-dev \
            libxcb-cursor-dev \
            libxcb-shm0-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxrender-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxi-dev \
            libxtst-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libasound2-dev \
            cmake \
            pkg-config

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package: Windows (.zip + portable) ──
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $bin = "target/${{ matrix.target }}/release/bmvp-text${{ matrix.ext }}"
          $dir = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Path $dir -Force
          Copy-Item $bin $dir/
          Copy-Item README.md $dir/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE $dir/ -ErrorAction SilentlyContinue
          tar.exe -a -c -f "dist/${{ matrix.artifact }}.zip" -C dist "${{ matrix.artifact }}"

      # ── Package: macOS (.dmg via create-dmg or .tar.gz fallback) ──
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          APP_DIR="dist/bmvp-text.app/Contents/MacOS"
          mkdir -p "$APP_DIR"
          cp "target/${{ matrix.target }}/release/bmvp-text${{ matrix.ext }}" "$APP_DIR/"
          # Create minimal Info.plist
          cat > "dist/bmvp-text.app/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>bmvp-text</string>
            <key>CFBundleDisplayName</key>
            <string>bmvp-text</string>
            <key>CFBundleIdentifier</key>
            <string>com.bytemvp.bmvp-text</string>
            <key>CFBundleVersion</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleExecutable</key>
            <string>bmvp-text</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          # Try to create .dmg, fallback to tar.gz
          if command -v create-dmg &>/dev/null; then
            create-dmg \
              --volname "bmvp-text" \
              --window-size 600 400 \
              --icon-size 128 \
              "dist/${{ matrix.artifact }}.dmg" \
              "dist/bmvp-text.app"
          else
            tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist bmvp-text.app
          fi

      # ── Package: Linux (.tar.gz + .deb) ──
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/bmvp-text${{ matrix.ext }}" "dist/${{ matrix.artifact }}/"
          cp README.md "dist/${{ matrix.artifact }}/" 2>/dev/null || true
          cp LICENSE "dist/${{ matrix.artifact }}/" 2>/dev/null || true
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"

          # Build .deb package
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Strip leading 'v'
          DEB_DIR="dist/deb"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/local/bin"
          cp "target/${{ matrix.target }}/release/bmvp-text" "$DEB_DIR/usr/local/bin/"
          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: bmvp-text
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: ByteMVP <dev@bytemvp.com>
          Description: A lightweight, high-performance code editor inspired by Zed
           Pure Rust + GPUI, zero AI bloat, instant response.
          Section: editors
          Priority: optional
          EOF
          dpkg-deb --build "$DEB_DIR" "dist/${{ matrix.artifact }}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
