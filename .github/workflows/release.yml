name: Release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bmvp-text-windows-x64
            ext: .exe

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bmvp-text-macos-arm64
            ext: ""

          # macOS Intel (cross-compiled on macos-latest since macos-13 is retired)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bmvp-text-macos-x64
            ext: ""

          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: bmvp-text-linux-x64
            ext: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Determine package version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
          else
            RAW_VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          echo "PKG_VERSION=${RAW_VER}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      # Linux: install system dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            libssl-dev \
            libzstd-dev \
            libdbus-1-dev \
            libsqlite3-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-composite0-dev \
            libxcb-randr0-dev \
            libxcb-cursor-dev \
            libxcb-shm0-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxrender-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxi-dev \
            libxtst-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libasound2-dev \
            cmake \
            pkg-config

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package: Windows (.zip + portable) ──
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 `
            -Target "${{ matrix.target }}" `
            -Version "${{ env.PKG_VERSION }}" `
            -ArtifactName "${{ matrix.artifact }}" `
            -SkipBuild

      # ── Package: macOS (.dmg via create-dmg or .tar.gz fallback) ──
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x ./scripts/package-macos.sh
          SKIP_BUILD=1 ./scripts/package-macos.sh \
            "${{ matrix.target }}" \
            "${{ env.PKG_VERSION }}" \
            "${{ matrix.artifact }}"

      # ── Package: Linux (.tar.gz + .deb) ──
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./scripts/package-linux.sh
          SKIP_BUILD=1 ./scripts/package-linux.sh \
            "${{ matrix.target }}" \
            "${{ env.PKG_VERSION }}" \
            "${{ matrix.artifact }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update dev-latest tag
        if: startsWith(github.ref, 'refs/tags/v') == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-latest HEAD
          git push -f origin refs/tags/dev-latest

      - name: Create Release (Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Dev Pre-Release
        if: startsWith(github.ref, 'refs/tags/v') == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev Latest (main)"
          body: |
            Automated rolling pre-release built from `main` after CI passed.
            Commit: `${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}`
          prerelease: true
          make_latest: 'false'
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
